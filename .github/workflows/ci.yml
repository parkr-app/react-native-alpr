name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # The cache probe runs before corepack enable and hits the runner's Yarn 1
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc --noEmit -p tsconfig.json
      - run: yarn lint
      - run: yarn prepare
