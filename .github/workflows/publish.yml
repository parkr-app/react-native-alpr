name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing; provenance is automatic
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, which trusted publishing requires (>= 11.5.1)
          node-version: 24
          # The cache probe runs before corepack enable and hits the runner's Yarn 1
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable

      - name: Check release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: yarn tsc --noEmit -p tsconfig.json
      - run: yarn lint
      - run: yarn fetch-binaries

      - name: Publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          version=$(node -p "require('./package.json').version")
          args=()
          case "$version" in *-*) args+=(--tag next) ;; esac
          # npm publish --dry-run fails once the version is on npm, so a dry run only packs.
          if [ "$DRY_RUN" = "true" ]; then npm pack --dry-run; else npm publish "${args[@]}"; fi
